<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Analytics</title>
<script type="application/ld+json">{{ jsonld|safe }}</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:var(--wcp-color-bg,#0d1117);color:var(--wcp-color-text,#e6edf3);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;overflow:hidden;}
.wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px;padding:20px;}
h2{font-size:15px;font-weight:700;color:var(--wcp-color-primary,#f0883e);}
p{font-size:12px;color:var(--wcp-color-text-muted,#8b949e);text-align:center;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:480px;}
.btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 10px;
  background:var(--wcp-color-surface,#161b22);border:1px solid var(--wcp-color-border,#30363d);border-radius:8px;
  color:var(--wcp-color-text,#e6edf3);cursor:pointer;font-size:11px;text-decoration:none;
  transition:background .15s,border-color .15s;}
.btn:hover{background:var(--wcp-color-surface-raised,#1c2128);border-color:var(--wcp-color-primary,#f0883e);}
.btn-icon{font-size:20px;}
.btn-label{font-weight:600;font-size:12px;}
.btn-desc{color:var(--wcp-color-text-muted,#8b949e);font-size:10px;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <h2>📊 Claude Analytics</h2>
  <p>Select an instrument to add to your dashboard</p>
  <div class="grid">
    <a class="btn" href="/widget/usage">
      <span class="btn-icon">☁️</span>
      <span class="btn-label">Usage</span>
      <span class="btn-desc">Token usage &amp; cost breakdown</span>
    </a>
    <a class="btn" href="/widget/productivity">
      <span class="btn-icon">📈</span>
      <span class="btn-label">Productivity</span>
      <span class="btn-desc">Developer activity &amp; model stats</span>
    </a>
    <a class="btn" href="/widget/local">
      <span class="btn-icon">🖥</span>
      <span class="btn-label">Local</span>
      <span class="btn-desc">MCP servers, plugins &amp; system</span>
    </a>
    <a class="btn" href="/widget/sessions">
      <span class="btn-icon">🕐</span>
      <span class="btn-label">Sessions</span>
      <span class="btn-desc">Recent Claude Code sessions</span>
    </a>
    <a class="btn" href="/widget/settings">
      <span class="btn-icon">⚙️</span>
      <span class="btn-label">Settings</span>
      <span class="btn-desc">API keys, agent URL &amp; downloads</span>
    </a>
  </div>
</div>
<script>
function _applyThemeVars(vars) {
  for (const [k, v] of Object.entries(vars))
    document.documentElement.style.setProperty(k, v);
}
window.parent?.postMessage({ type: 'wcp:ready' }, '*');
window.parent?.postMessage({ type: 'wcp:request-theme' }, '*');
window.addEventListener('message', e => {
  if (e.data?.type === 'wcp:context' && e.data.theme) _applyThemeVars(e.data.theme);
  if (e.data?.type === 'wcp:theme' && e.data.vars)    _applyThemeVars(e.data.vars);
});
</script>
</body>
</html>
