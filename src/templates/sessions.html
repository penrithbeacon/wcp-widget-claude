<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Local: Sessions — Claude Analytics</title>
<script type="application/ld+json">{{ jsonld|safe }}</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--wcp-color-bg,#0d1117);
  color:var(--wcp-color-text,#e6edf3);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;}

/* ── Themed scrollbars ──────────────────────────────────────────── */
*::-webkit-scrollbar{width:8px;height:8px;}
*::-webkit-scrollbar-track{background:var(--wcp-color-surface-raised,#1c2128);}
*::-webkit-scrollbar-thumb{background:var(--wcp-color-border,#30363d);border-radius:4px;}
*::-webkit-scrollbar-thumb:hover{background:var(--wcp-color-text-muted,#8b949e);}
*{scrollbar-color:var(--wcp-color-border,#30363d) var(--wcp-color-surface-raised,#1c2128);scrollbar-width:thin;}

/* ── Layout ─────────────────────────────────────────────────────── */
.instrument{display:flex;height:100%;padding:10px;overflow:hidden;}
.card{display:flex;flex-direction:column;flex:1;min-width:0;overflow:hidden;
  border:1px solid var(--wcp-color-border,#30363d);border-radius:8px;background:var(--wcp-color-surface,#161b22);}
.card-header{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
  padding:9px 12px;border-bottom:1px solid var(--wcp-color-border,#30363d);gap:8px;}
.card-title{font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;min-width:0;}
.card-title-icon{flex-shrink:0;opacity:.7;font-size:14px;}
.card-title-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-subtitle{font-size:11px;color:var(--wcp-color-text-muted,#8b949e);font-weight:400;flex-shrink:0;}
.refresh-btn{background:none;border:none;color:var(--wcp-color-text-muted,#8b949e);cursor:pointer;
  padding:3px 6px;border-radius:5px;font-size:14px;line-height:1;flex-shrink:0;
  transition:color .15s,background .15s;}
.refresh-btn:hover{color:var(--wcp-color-text,#e6edf3);background:var(--wcp-color-surface-raised,#1c2128);}
.refresh-btn.spinning{animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.card-body{flex:1;overflow-y:auto;padding:2px 0;}

/* ── Session rows ────────────────────────────────────────────────── */
.session-row{display:flex;align-items:center;gap:10px;padding:8px 12px;
  border-bottom:1px solid rgba(48,54,61,.3);font-size:12px;}
.session-row:last-child{border-bottom:none;}
.session-row:hover{background:var(--wcp-color-surface-raised,#1c2128);}
.session-icon{font-size:14px;opacity:.6;flex-shrink:0;}
.session-info{flex:1;min-width:0;}
.session-dir{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.session-meta{font-size:11px;color:var(--wcp-color-text-muted,#8b949e);margin-top:1px;}
.session-time{font-size:11px;color:var(--wcp-color-text-muted,#8b949e);flex-shrink:0;white-space:nowrap;}

/* ── Setup prompt ────────────────────────────────────────────────── */
.setup-prompt{padding:20px;text-align:center;color:var(--wcp-color-text-muted,#8b949e);}
.setup-prompt h3{color:var(--wcp-color-primary,#f0883e);font-size:13px;margin-bottom:8px;}
.setup-prompt p{font-size:12px;line-height:1.5;margin-bottom:10px;}
.setup-link{color:var(--wcp-color-info,#58a6ff);text-decoration:none;font-size:12px;font-weight:500;}
.setup-link:hover{text-decoration:underline;}

.state-msg{padding:16px 12px;font-size:12px;color:var(--wcp-color-text-muted,#8b949e);}
.state-error{color:var(--wcp-color-danger,#f85149);}
</style>
</head>
<body>
<div class="instrument">
  <div class="card">
    <div class="card-header">
      <div class="card-title">
        <span class="card-title-icon">🕐</span>
        <span class="card-title-text">Recent Sessions</span>
      </div>
      <span class="card-subtitle" id="session-count"></span>
      <button class="refresh-btn" id="btn-sessions" title="Refresh" onclick="loadSessions()">↺</button>
    </div>
    <div class="card-body" id="body-sessions">
      {% if has_agent %}
      <div class="state-msg">Loading…</div>
      {% else %}
      <div class="setup-prompt">
        <h3>Host Agent Required</h3>
        <p>Install the Claude Analytics host agent to see your recent Claude Code sessions.</p>
        <a class="setup-link" href="/widget/settings">Install Agent →</a>
      </div>
      {% endif %}
    </div>
  </div>
</div>

<script>
const HAS_AGENT = {{ 'true' if has_agent else 'false' }};

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function spin(id, on) {
  const btn = document.getElementById(id);
  if (on) btn.classList.add('spinning'); else btn.classList.remove('spinning');
}

function timeAgo(ts) {
  if (!ts) return '';
  const diff = Date.now() - new Date(ts).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + 'm ago';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + 'h ago';
  const days = Math.floor(hrs / 24);
  return days + 'd ago';
}

function shortenPath(p) {
  if (!p) return '~';
  // Replace home dir with ~
  return p.replace(/^\/Users\/[^/]+/, '~').replace(/^\/home\/[^/]+/, '~');
}

async function loadSessions() {
  if (!HAS_AGENT) return;
  spin('btn-sessions', true);
  try {
    const r = await fetch('/widget/api/agent/sessions');
    const j = await r.json();
    if (!j.success) throw new Error(j.error || 'Failed');
    renderSessions(j.data);
  } catch (e) {
    document.getElementById('body-sessions').innerHTML =
      `<div class="state-msg state-error">${esc(e.message)}</div>`;
  }
  spin('btn-sessions', false);
}

function renderSessions(data) {
  const body = document.getElementById('body-sessions');
  const sessions = data.sessions || [];
  document.getElementById('session-count').textContent = sessions.length + ' recent';

  if (sessions.length === 0) {
    body.innerHTML = '<div class="state-msg">No recent sessions found.</div>';
    return;
  }

  let html = '';
  sessions.forEach(s => {
    const icon = s.kind === 'code' ? '💻' : s.kind === 'chat' ? '💬' : '📝';
    html += `<div class="session-row">
      <span class="session-icon">${icon}</span>
      <div class="session-info">
        <div class="session-dir" title="${esc(s.cwd || s.working_directory || '')}">${esc(shortenPath(s.cwd || s.working_directory))}</div>
        <div class="session-meta">${esc(s.kind || 'session')}</div>
      </div>
      <span class="session-time">${timeAgo(s.modified || s.updated_at)}</span>
    </div>`;
  });
  body.innerHTML = html;
}

// ── Init ─────────────────────────────────────────────────────────────────────

function _applyThemeVars(vars) {
  for (const [k, v] of Object.entries(vars))
    document.documentElement.style.setProperty(k, v);
}
window.parent?.postMessage({ type: 'wcp:ready' }, '*');
// WCP Conditional Visibility — hide API components when no admin key is configured
window.parent?.postMessage({ type: 'wcp:set-component-visibility', components: {
  'claude-api-usage': {{ 'true' if has_api_key else 'false' }},
  'claude-api-productivity': {{ 'true' if has_api_key else 'false' }},
}}, '*');
window.parent?.postMessage({ type: 'wcp:request-theme' }, '*');
window.addEventListener('message', e => {
  if (e.data?.type === 'wcp:context' && e.data.theme) _applyThemeVars(e.data.theme);
  if (e.data?.type === 'wcp:theme' && e.data.vars)    _applyThemeVars(e.data.vars);
});

if (HAS_AGENT) loadSessions();
</script>
</body>
</html>
